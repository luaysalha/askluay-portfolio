backend:
  name: github
  repo: luaysalha/askluay-portfolio
  branch: main
  base_url: https://askluay-cms-auth.luaysalha.workers.dev

# Media you upload in the dashboard lands here and is referenced from the site.
# Paths are relative to the REPO ROOT — the site lives in the portfolio/ folder.
media_folder: "portfolio/assets"
public_folder: "assets"

site_url: https://luaysalha.github.io/askluay-portfolio/
display_url: https://luaysalha.github.io/askluay-portfolio/

collections:
  - name: "work"
    label: "Work / Projects"
    delete: false
    files:
      - name: "projects"
        label: "All projects (drag to reorder)"
        file: "portfolio/data/projects.json"
        description: "Add, edit, reorder or remove the cards in the Work grid."
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}  ·  {{fields.type}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "type", widget: "select", options: ["film", "brand", "motion", "digital"], default: "film" }
              - { label: "One-line description", name: "blurb", widget: "string" }
              - { label: "Image", name: "img", widget: "image", required: false, hint: "Upload a picture/GIF. Use this for design & brand work." }
              - { label: "YouTube ID", name: "yt", widget: "string", required: false, hint: "Just the ID from the URL, e.g. 1TQYoG44o5A — plays inline on the site." }
              - { label: "Video file", name: "file", widget: "file", required: false, hint: "Upload your own small video (keep under ~20MB). Plays inline." }
              - { label: "Poster image (for a video file)", name: "poster", widget: "image", required: false }
              - { label: "External link", name: "href", widget: "string", required: false, hint: "For TikTok or a YouTube that blocks embedding — opens in a new tab." }

              - { label: "Hide until ready", name: "hidden", widget: "boolean", default: false, required: false }
              - { label: "My role", name: "role", widget: "string", required: false }
              - { label: "External link label", name: "linkLabel", widget: "string", required: false }
              - { label: "Image fit", name: "fit", widget: "select", options: ["cover", "contain"], default: "cover", required: false }
              - { label: "Loop video", name: "loop", widget: "boolean", default: false, required: false }
              - { label: "Additional categories", name: "categories", widget: "select", multiple: true, options: ["film", "brand", "motion", "digital"], required: false }
              - { label: "Written project", name: "caseStudy", widget: "boolean", default: false, required: false }
              - { label: "Director", name: "director", widget: "string", required: false }
              - { label: "My contribution", name: "details", widget: "text", required: false }
              - { label: "Film synopsis", name: "synopsis", widget: "text", required: false }
              - label: "Coverage links"
                name: "coverage"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
