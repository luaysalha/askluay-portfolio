backend:
  name: git-gateway
  branch: main

media_folder: "portfolio/assets"
public_folder: "assets"

site_url: https://askluay-portfolio.netlify.app
display_url: https://askluay-portfolio.netlify.app

collections:
  - name: "work"
    label: "Work / Projects"
    delete: false
    files:
      - name: "projects"
        label: "All projects (drag to reorder)"
        file: "portfolio/data/projects.json"
        description: "Add, edit, reorder or remove the cards in the Work grid."
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}  ·  {{fields.type}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "type", widget: "select", options: ["film", "brand", "motion", "digital"], default: "film" }
              - { label: "One-line description", name: "blurb", widget: "string" }
              - { label: "Image", name: "img", widget: "image", required: false }
              - { label: "YouTube ID", name: "yt", widget: "string", required: false }
              - { label: "Video file", name: "file", widget: "file", required: false }
              - { label: "Poster image (for a video file)", name: "poster", widget: "image", required: false }
              - { label: "External link", name: "href", widget: "string", required: false }
